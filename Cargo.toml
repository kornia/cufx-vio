# The payload crate is a SEPARATE member, not a module of this one: a stereo driver has to name the
# types it produces, and making it depend on this crate to do so would put kornia-slam behind
# every driver that feeds a VIO graph.
[workspace]
members = ["crates/cufx-sensor-payloads"]

# Hoisted because both members name them: the spec string is what cargo keys a git source on, so
# two spellings of a copper-rs crate would be two `CuMsg` types and a copperlist that does not
# type-check. `workspace = true` makes drift impossible to introduce by accident. Every copper-rs
# crate below uses the IDENTICAL git + rev spec for the same reason.
[workspace.dependencies]
cu29 = { git = "https://github.com/copper-project/copper-rs", rev = "fe2061dc10539868334f6ded55a9e75feb0f2b62" }
# Without its `kornia` feature: that pulls kornia-image from crates.io, a second `Image` type next
# to the git one kornia-slam uses. The eye-to-`Image` conversion is ours instead.
cu-sensor-payloads = { git = "https://github.com/copper-project/copper-rs", rev = "fe2061dc10539868334f6ded55a9e75feb0f2b62" }
cu-spatial-payloads = { git = "https://github.com/copper-project/copper-rs", rev = "fe2061dc10539868334f6ded55a9e75feb0f2b62" }
cu29-build = { git = "https://github.com/copper-project/copper-rs", rev = "fe2061dc10539868334f6ded55a9e75feb0f2b62" }
cu29-export = { git = "https://github.com/copper-project/copper-rs", rev = "fe2061dc10539868334f6ded55a9e75feb0f2b62" }
# The bincode derives emit `::bincode::` paths, so the crate is named `bincode` here; this is the
# same package and version cu29 itself depends on, so the traits are cu29's traits.
bincode = { package = "cu-bincode", version = "2.1", default-features = false, features = [
  "derive",
  "alloc",
] }
# Typed thiserror enums, not anyhow.
thiserror = "2"
serde = { version = "1", features = ["derive"] }

[package]
name = "cufx-vio"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Edgar Riba <edgar.riba@gmail.com>"]
publish = false
description = "Copper tasks wrapping kornia-slam stereo visual-inertial odometry"
repository = "https://github.com/kornia/cufx-vio"

# The copper component catalog scrapes this.
[package.metadata.copper]
kind = "task"
domains = ["algorithm/localization", "vision/stereo"]
environments = ["host"]

[dependencies]
cu29 = { workspace = true }
cu-spatial-payloads = { workspace = true }
# A CONSUMER THAT NAMES BOTH CRATES MUST SPELL THEM IDENTICALLY. This is a path dep here, so it
# inherits this package's source: pulled from git, it resolves to
# `(cufx-sensor-payloads, git+<this repo>?branch=main)`. A consumer that writes `branch = "main"`
# for cufx-vio and `rev = "..."` for this one gets TWO packages at one sha and two `StereoPair`
# types, with an error naming the same path twice.
cufx-sensor-payloads = { path = "crates/cufx-sensor-payloads" }

# kornia: there is NO [patch] table. Cargo keys a git source on the exact spec string, so every
# consumer of this crate must spell each spec identically (`branch = "develop"` for the two
# kornia-slam repo crates, `branch = "main"` for the four kornia-rs ones) or the graph splits into
# two `Image<u8,1>` types and two `TrackingStatus` types, which is the single most expensive
# mistake available here.
kornia-slam = { git = "https://github.com/kornia/kornia-slam", branch = "develop" }
# The IMU types (`ImuMeasurement`, `ImuBias`, `ImuCalib`, `PreintegratedImu`) are NOT re-exported
# by kornia-slam — `Map::add_imu_factor` and `ImuInitializer::try_initialize` take them by name
# from this crate, so naming them here is the only way to call those APIs. It is a workspace
# member of the kornia-slam repo, so the spec string MUST be spelled exactly as the line above:
# a different spelling is a different cargo source, which would make `ImuBias` here a DIFFERENT
# type from the `ImuBias` in `add_imu_factor`'s signature, with a type error that names the same
# path twice.
kornia-sensors = { git = "https://github.com/kornia/kornia-slam", branch = "develop" }
kornia-image = { git = "https://github.com/kornia/kornia-rs", branch = "main" }
kornia-3d = { git = "https://github.com/kornia/kornia-rs", branch = "main" }
kornia-algebra = { git = "https://github.com/kornia/kornia-rs", branch = "main" }
kornia-imgproc = { git = "https://github.com/kornia/kornia-rs", branch = "main" }

thiserror = { workspace = true }
# Only for the inertial RON block: the camera-to-IMU extrinsic is 12 numbers and cu29's
# `ComponentConfig::get::<T>` handles scalars only, so `get_value::<T>` (serde) is the one
# way to read a matrix out of a component config. serde is already in the tree via cu29.
serde = { workspace = true }

# Only the `stereo_vio_logreader` example uses it, to extract the example's copperlists.
[dev-dependencies]
cu29-export = { workspace = true }

# cu29's logging macros intern their format strings at build time.
[build-dependencies]
cu29-build = { workspace = true }
